<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="ttl desc">
<title id="ttl">Agent Insight 生产 Trace 数据演化流程</title>
<desc id="desc">输入生产Trace，经低价值过滤、智能采样、加权随机选择演化算子、七种演化操作、演化N轮循环、数据脱敏，输出高价值代表性数据集。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FCFF"/><stop offset="0.55" stop-color="#F3F8FF"/><stop offset="1" stop-color="#F5FAFF"/></linearGradient>
 <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2669F4"/><stop offset="1" stop-color="#45B6ED"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#735EF5"/><stop offset="1" stop-color="#B18BFF"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10B8C6"/><stop offset="1" stop-color="#69DCD1"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F9FF"/></linearGradient>
 <linearGradient id="evolution" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1F7FF"/><stop offset="0.65" stop-color="#F6F7FF"/><stop offset="1" stop-color="#EFFBFF"/></linearGradient>
 <linearGradient id="paleBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8F1FF"/><stop offset="1" stop-color="#DCEAFF"/></linearGradient>
 <linearGradient id="palePurple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFEDFF"/><stop offset="1" stop-color="#E5E8FF"/></linearGradient>
 <linearGradient id="paleCyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCF9F7"/><stop offset="1" stop-color="#E7F7FF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="150%" height="165%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset in="blur" dx="0" dy="10" result="offset"/><feComponentTransfer in="offset" result="shadowAlpha"><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feMerge><feMergeNode in="shadowAlpha"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
 <pattern id="dots" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#8BADEB" opacity=".2"/></pattern>
 <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L12 7L1 13" fill="none" stroke="#6091F4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrowViolet" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L12 7.5L1 14" fill="none" stroke="#8C78EF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L12 7L1 13" fill="none" stroke="#26B2C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
 text{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;text-rendering:geometricPrecision;}
 .ttl{font-size:66px;font-weight:800;fill:#102A57;letter-spacing:1px}
 .sub{font-size:28px;font-weight:400;fill:#6C7F9E;letter-spacing:.7px}
 .step{font-size:35px;font-weight:750;fill:#183967;}
 .mid{font-size:38px;font-weight:750;fill:#153462}
 .operator{font-size:30px;font-weight:700;fill:#284777}
 .small{font-size:24px;font-weight:600;fill:#6480A6;letter-spacing:.4px}
 .tiny{font-size:22px;font-weight:700;fill:#7A92B5}
 </style>
</defs>
<rect width="2400" height="1400" fill="url(#bg)"/>
<circle cx="2150" cy="120" r="360" fill="#BBD7FF" opacity=".18" filter="url(#glow)"/>
<circle cx="340" cy="1210" r="310" fill="#ABF0F0" opacity=".11" filter="url(#glow)"/>
