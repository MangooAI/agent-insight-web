<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
<title id="title">Agent Insight 跨层执行链路追踪与重建</title>
<desc id="desc">Agent层、MaaS网关层、推理层共享同一链路ID并各自上报追踪数据，经过多源数据归一化、跨层链路重建与分层耗时分解，最终生成执行链路记录。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FCFEFF"/><stop offset=".58" stop-color="#F5F9FF"/><stop offset="1" stop-color="#EEF6FF"/>
  </linearGradient>
  <radialGradient id="mist" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#D8EAFF" stop-opacity=".75"/><stop offset="1" stop-color="#D8EAFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E4F0FF"/><stop offset="1" stop-color="#F0F7FF"/></linearGradient>
  <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2F9FF"/><stop offset="1" stop-color="#D9EBFF"/></linearGradient>
  <linearGradient id="maas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7FF"/><stop offset="1" stop-color="#E8E5FF"/></linearGradient>
  <linearGradient id="infer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1FEFF"/><stop offset="1" stop-color="#D8F9F6"/></linearGradient>
  <linearGradient id="norm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset="1" stop-color="#DAEDFF"/></linearGradient>
  <linearGradient id="rebuild" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7FF"/><stop offset="1" stop-color="#E9E3FF"/></linearGradient>
  <linearGradient id="record" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6FFFF"/><stop offset="1" stop-color="#D2F7F0"/></linearGradient>
  <linearGradient id="blueline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73C6FC"/><stop offset=".52" stop-color="#438BFF"/><stop offset="1" stop-color="#65C7EF"/></linearGradient>
  <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#97DAFF"/><stop offset="1" stop-color="#326BE8"/></linearGradient>
  <linearGradient id="iconblue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#87D9FE"/><stop offset="1" stop-color="#2A75F8"/></linearGradient>
  <linearGradient id="iconviolet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A6A3FF"/><stop offset="1" stop-color="#6964E9"/></linearGradient>
  <linearGradient id="iconteal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52DEDF"/><stop offset="1" stop-color="#0FA9A4"/></linearGradient>
  <filter id="shadow" x="-25%" y="-40%" width="150%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3F83D5" flood-opacity=".12"/>
  </filter>
  <filter id="softshadow" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4A86C8" flood-opacity=".14"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1 1 L10 6 L1 11 Z" fill="#4B92F6"/>
  </marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#A5C7ED" opacity=".48"/></pattern>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
<circle cx="94" cy="142" r="310" fill="url(#mist)" opacity=".35"/>
<circle cx="1510" cy="664" r="380" fill="url(#mist)" opacity=".45"/>
<path d="M0 800 C410 678 555 878 892 800 S1340 666 1600 747" stroke="#BFDDFB" stroke-width="2" opacity=".55" fill="none"/>
<path d="M0 833 C410 710 540 905 920 831 S1358 700 1600 775" stroke="#D0E8FC" stroke-width="3" opacity=".65" fill="none"/>
<path d="M0 864 C400 740 540 933 942 854 S1405 745 1600 798" stroke="#DCEFFD" stroke-width="2" opacity=".8" fill="none"/>
<path d="M0 0 L124 0 L0 133Z" fill="#E6F1FE" opacity=".56"/>
<path d="M1600 0 L1507 0 L1600 104Z" fill="#D0EBFC" opacity=".62"/>
<rect x="35" y="480" width="215" height="165" rx="23" fill="url(#dots)" opacity=".27"/>
<rect x="1350" y="375" width="185" height="170" rx="23" fill="url(#dots)" opacity=".30"/>
<!-- floating analytics accents -->
<g opacity=".48" transform="rotate(8 166 525)">
  <rect x="52" y="447" width="205" height="148" rx="24" fill="#DFEEFF" stroke="#CCE2FF"/>
  <path d="M80 485 H183 M80 504 H208 M80 523 H164 M80 542 H197" stroke="#F8FCFF" stroke-width="8" stroke-linecap="round"/>
</g>
<g opacity=".68">
  <rect x="91" y="622" width="206" height="119" rx="23" fill="#CFE3FF" fill-opacity=".65" stroke="#A9CAFC"/>
  <path d="M122 703 L157 664 L195 686 L242 647" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="122" cy="703" r="8" fill="#FFFFFF"/><circle cx="157" cy="664" r="8" fill="#FFFFFF"/><circle cx="195" cy="686" r="8" fill="#FFFFFF"/><circle cx="242" cy="647" r="8" fill="#FFFFFF"/>
</g>
<g opacity=".70" transform="rotate(-11 1469 568)">
  <rect x="1345" y="494" width="213" height="147" rx="22" fill="#D5E5FF" stroke="#BCD7FA"/>
  <path d="M1390 603 V566 M1426 603 V544 M1462 603 V526 M1498 603 V505" stroke="#FDFEFF" stroke-width="13" stroke-linecap="round"/>
</g>
<!-- header caption -->
<rect x="265" y="33" width="1070" height="69" rx="35" fill="url(#head)" stroke="#D8E8FB" stroke-width="1.4" filter="url(#softshadow)"/>
<path d="M151 68 H235 M1365 68 H1449" stroke="url(#blueline)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
<text x="800" y="79" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#153965">链路上下文逐层透传 · 三层共享同一链路ID · 各自上报追踪数据</text>
<!-- top dashed source boundary -->
<rect x="118" y="130" width="1364" height="197" rx="29" fill="#EEF6FF" fill-opacity=".15" stroke="#8FC3FF" stroke-width="2" stroke-dasharray="8 8"/>
<!-- source cards -->
<g filter="url(#shadow)">
  <rect x="149" y="155" width="391" height="147" rx="28" fill="url(#agent)" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="604" y="155" width="391" height="147" rx="28" fill="url(#maas)" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="1059" y="155" width="391" height="147" rx="28" fill="url(#infer)" stroke="#FFFFFF" stroke-width="2.5"/>
</g>
<!-- layered agent icon -->
<g transform="translate(247 194)">
  <path d="M-32 25 L0 8 L32 25 L0 44Z" fill="#A9D4FF"/>
  <path d="M-32 14 L0 -3 L32 14 L0 33Z" fill="#3785ED"/>
  <path d="M-32 1 L0 -17 L32 1 L0 20Z" fill="url(#iconblue)"/>
  <path d="M-28 31 L0 47 L28 31" fill="none" stroke="#2468D0" stroke-width="5" stroke-linejoin="round" opacity=".6"/>
</g>
<text x="296" y="241" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="37" font-weight="800" fill="#193B66">Agent层</text>
<!-- cloud and gear -->
<g transform="translate(703 227)" fill="none" stroke="url(#iconviolet)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
 <path d="M-32 16 C-49 15 -49 -10 -34 -16 C-27 -19 -24 -17 -18 -17 C-14 -39 17 -42 25 -23 C48 -24 54 8 34 16 H-32"/>
 <circle cx="1" cy="16" r="14" stroke="#7068E8" fill="#E7E5FF"/>
 <path d="M1 -4 V-1 M1 33 V36 M-19 16 H-16 M18 16 H21 M-13 3 L-11 5 M13 28 L15 30 M15 3 L13 5 M-11 28 L-13 30" stroke="#7068E8" stroke-width="4"/>
</g>
<text x="757" y="241" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="800" fill="#193B66">MaaS网关层</text>
<!-- chip icon -->
<g transform="translate(1158 225)" fill="none" stroke="url(#iconteal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-23" y="-23" width="46" height="46" rx="7"/>
  <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#5BE4D4" opacity=".62" stroke="none"/>
  <path d="M-14 -33 V-23 M0 -33 V-23 M14 -33 V-23 M-14 23 V33 M0 23 V33 M14 23 V33 M-33 -14 H-23 M-33 0 H-23 M-33 14 H-23 M23 -14 H33 M23 0 H33 M23 14 H33"/>
</g>
<text x="1216" y="241" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="39" font-weight="800" fill="#193B66">推理层</text>
<!-- convergence lines; all three sources feed the same downstream process -->
<path d="M344 303 V348 Q344 357 359 357 H800" fill="none" stroke="url(#blueline)" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M800 303 V376" fill="none" stroke="url(#vertical)" stroke-width="4.2" stroke-linecap="round"/>
<path d="M1254 303 V348 Q1254 357 1239 357 H800" fill="none" stroke="url(#blueline)" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M787 364 L800 382 L813 364" fill="#468EF7"/>
<!-- central pipeline backdrop -->
<ellipse cx="800" cy="847" rx="505" ry="63" fill="#C5E3FF" opacity=".31"/>
<ellipse cx="800" cy="837" rx="449" ry="44" fill="none" stroke="#94C0FF" stroke-width="2.1" opacity=".56"/>
<ellipse cx="800" cy="825" rx="377" ry="37" fill="#B3D3FF" opacity=".22"/>
<!-- block 1 -->
<g filter="url(#shadow)"><rect x="442" y="393" width="716" height="105" rx="53" fill="url(#norm)" stroke="#B8E5FC" stroke-width="2.5"/></g>
<g transform="translate(585 446)" fill="none" stroke="url(#iconblue)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-28 -24 V24 C-28 38 28 38 28 24 V-24"/>
  <ellipse cx="0" cy="-24" rx="28" ry="11"/>
  <path d="M-28 -8 C-28 6 28 6 28 -8 M-28 10 C-28 24 28 24 28 10"/>
</g>
<text x="808" y="461" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="39" font-weight="800" fill="#173D69">多源数据归一化</text>
<!-- arrows -->
<path d="M800 501 V540" stroke="#6DB6F7" stroke-width="7" stroke-linecap="round"/>
<path d="M786 527 L800 549 L814 527 Z" fill="#4B90F3"/>
<!-- block 2 -->
<g filter="url(#shadow)"><rect x="442" y="557" width="716" height="105" rx="53" fill="url(#rebuild)" stroke="#CEC9FF" stroke-width="2.5"/></g>
<g transform="translate(511 606)" stroke="url(#iconviolet)" stroke-width="5.5" stroke-linecap="round" fill="none" stroke-linejoin="round">
  <rect x="-8" y="-31" width="16" height="16" rx="4" fill="#867DFA" stroke="none"/>
  <path d="M0 -15 V5 M-26 6 H26 M-26 6 V18 M26 6 V18 M0 6 V18"/>
  <circle cx="-26" cy="23" r="8" fill="#918CFF" stroke="none"/>
  <circle cx="0" cy="23" r="8" fill="#918CFF" stroke="none"/>
  <circle cx="26" cy="23" r="8" fill="#918CFF" stroke="none"/>
</g>
<text x="814" y="623" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="800" fill="#173D69">跨层链路重建 · 分层耗时分解</text>
<!-- arrow -->
<path d="M800 665 V705" stroke="#6DB6F7" stroke-width="7" stroke-linecap="round"/>
<path d="M786 692 L800 714 L814 692 Z" fill="#4B90F3"/>
<!-- block 3 -->
<g filter="url(#shadow)"><rect x="442" y="720" width="716" height="105" rx="53" fill="url(#record)" stroke="#AAEDE3" stroke-width="2.5"/></g>
<g transform="translate(584 769)" stroke="#18AFAF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M-25 -26 H15 Q20 -26 20 -20 V26 H-25 Q-30 26 -30 21 V-21 Q-30 -26 -25 -26 Z" fill="#D8FAF6"/>
  <path d="M-16 -11 H6 M-16 1 H2 M-16 13 H-6"/>
  <circle cx="23" cy="19" r="19" fill="#29CDB4" stroke="#ECFFFC" stroke-width="3.5"/>
  <path d="M14 19 L21 26 L32 13" stroke="white" stroke-width="5"/>
</g>
<text x="821" y="786" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="39" font-weight="800" fill="#173D69">生成执行链路记录</text>
</svg>