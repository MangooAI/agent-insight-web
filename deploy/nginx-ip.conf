# Agent Insight 官网 nginx 配置（Ubuntu/Debian，仅 IP 访问）
# 放置位置：/etc/nginx/sites-available/agent-insight.conf
# 启用：sudo ln -s /etc/nginx/sites-available/agent-insight.conf /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/agent-insight;
    index index.html;
    charset utf-8;

    # 中文 Markdown、JSON 正确编码
    types { text/markdown md; }
    charset_types text/html text/css application/javascript application/json text/markdown;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown image/svg+xml;

    # 文档与目录：每次都校验，更新后立即生效
    location ~* \.(md|json|html)$ {
        add_header Cache-Control "no-cache";
    }
    # 样式与脚本：页面引用时带了 ?v= 版本号，可放心长缓存
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
    # 图片与视频
    location ~* \.(png|jpg|jpeg|webp|gif|svg|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 不对外暴露的目录
    location ~ ^/(tools|deploy|legacy|\.hallmark)/ { deny all; }
    location ~ /\. { deny all; }

    error_page 404 /404.html;
}
